plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

jarJar.enable()

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'fml.earlydisplay', 'true'
            property 'org.lwjgl.util.Debug', 'false'
            property 'org.lwjgl.util.DebugAllocator', 'false'
            property 'vulkanmod.compat.externalLod', System.getProperty('vulkanmod.compat.externalLod', 'off')
            property 'vulkanmod.compat.externalLod.draw', System.getProperty('vulkanmod.compat.externalLod.draw', 'true')
            property 'vulkanmod.compat.externalLod.debugDraw', System.getProperty('vulkanmod.compat.externalLod.debugDraw', 'false')
            jvmArg '-ea'
            jvmArg '-XX:+UseZGC'
            jvmArg '-XX:SoftMaxHeapSize=1536m'

            mods {
                vulkanmod {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            args '--nogui'

            mods {
                vulkanmod {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

            mods {
                vulkanmod {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    nativesWindows {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    nativesLinux {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    nativesMacos {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    nativesMacosArm64 {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

project.ext.lwjglVersion = '3.3.3'
def lwjglJarJarVersion = "[$lwjglVersion,3.3.4)"

def host = org.gradle.internal.os.OperatingSystem.current()
project.ext.devNatives = host.windows ? 'natives-windows'
        : host.macOsX ? (System.getProperty('os.arch').contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos')
        : 'natives-linux'

repositories {
    mavenCentral()
    maven {
        name = 'Sinytra'
        url = 'https://maven.su5ed.dev/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Forgified Fabric API supplies the Fabric Rendering API that Continuity emits
    // connected-texture quads through. Compile-time only: it is a runtime dependency of
    // Continuity itself, so it is always present when the FRAPI path actually matters.
    compileOnly fg.deobf("dev.su5ed.sinytra.fabric-api:fabric-renderer-api-v1:${ffapi_renderer_api_version}")
    compileOnly fg.deobf("dev.su5ed.sinytra.fabric-api:fabric-api-base:${ffapi_api_base_version}")

    implementation "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-vma:$lwjglVersion"

    runtimeOnly "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$devNatives"
    runtimeOnly "org.lwjgl:lwjgl-vma:$lwjglVersion:$devNatives"

    // ForgeGradle's Jar-in-Jar metadata requires Maven version ranges.
    jarJar "org.lwjgl:lwjgl-vulkan:$lwjglJarJarVersion"
    jarJar "org.lwjgl:lwjgl-shaderc:$lwjglJarJarVersion"
    jarJar "org.lwjgl:lwjgl-vma:$lwjglJarJarVersion"
    nativesWindows "org.lwjgl:lwjgl-shaderc:$lwjglVersion:natives-windows"
    nativesWindows "org.lwjgl:lwjgl-vma:$lwjglVersion:natives-windows"
    nativesLinux "org.lwjgl:lwjgl-shaderc:$lwjglVersion:natives-linux"
    nativesLinux "org.lwjgl:lwjgl-vma:$lwjglVersion:natives-linux"
    nativesMacos "org.lwjgl:lwjgl-shaderc:$lwjglVersion:natives-macos"
    nativesMacos "org.lwjgl:lwjgl-vma:$lwjglVersion:natives-macos"
    nativesMacos "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos"
    nativesMacosArm64 "org.lwjgl:lwjgl-shaderc:$lwjglVersion:natives-macos-arm64"
    nativesMacosArm64 "org.lwjgl:lwjgl-vma:$lwjglVersion:natives-macos-arm64"
    nativesMacosArm64 "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos-arm64"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

configurations.jarJar {
    exclude group: 'org.lwjgl', module: 'lwjgl'
    exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
    exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    exclude group: 'org.lwjgl', module: 'lwjgl-stb'
}

mixin {
    add sourceSets.main, 'vulkanmod.refmap.json'
    config 'vulkanmod.mixins.json'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    withSourcesJar()
}

tasks.named('jar', Jar).configure {
    archiveClassifier.set('slim')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Native JARs are unpacked into the mod JAR. Forge's Jar-in-Jar locator only accepts
    // loadable Java dependencies and rejects classifier-only native archives as mod files.
    into('assets/vulkanmod/natives/windows/x64') {
        from { project.configurations.nativesWindows.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/linux/x64') {
        from { project.configurations.nativesLinux.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/macos/x64') {
        from { project.configurations.nativesMacos.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/macos/arm64') {
        from { project.configurations.nativesMacosArm64.collect { zipTree(it) } }
    }

    manifest {
        attributes 'MixinConfigs': 'vulkanmod.mixins.json'
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('COPYING') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('NOTICE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ForgeGradle reobfuscates the Jar-in-Jar output, which is the distributable artifact.
reobf {
    jarJar {}
}

tasks.named('jarJar').configure {
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    into('assets/vulkanmod/natives/windows/x64') {
        from { project.configurations.nativesWindows.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/linux/x64') {
        from { project.configurations.nativesLinux.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/macos/x64') {
        from { project.configurations.nativesMacos.collect { zipTree(it) } }
    }
    into('assets/vulkanmod/natives/macos/arm64') {
        from { project.configurations.nativesMacosArm64.collect { zipTree(it) } }
    }

    finalizedBy tasks.named('reobfJarJar')

    doLast {
        def jarFile = archiveFile.get().asFile
        def tmpDir = new File(temporaryDir, 'repack')

        tmpDir.deleteDir()
        tmpDir.mkdirs()
        ant.unzip(src: jarFile, dest: tmpDir)

        def jarjarDir = new File(tmpDir, 'META-INF/jarjar')
        if (jarjarDir.exists()) {
            jarjarDir.listFiles().findAll { it.name.endsWith('.jar') && it.name.startsWith('lwjgl-') }.each { embeddedJar ->
                def stripped = new File(temporaryDir, "stripped-${embeddedJar.name}")
                ant.zip(destfile: stripped) {
                    zipfileset(src: embeddedJar) {
                        exclude(name: 'module-info.class')
                        exclude(name: 'META-INF/versions/*/module-info.class')
                    }
                }
                embeddedJar.delete()
                stripped.renameTo(embeddedJar)
            }

        }

        jarFile.delete()
        ant.zip(destfile: jarFile, basedir: tmpDir)
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
            jarJar.component(it)
        }
    }
}
