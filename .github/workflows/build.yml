# Build the Forge 1.20.1 artifact for every change to the release branch.

name: build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.20.1
  pull_request:
    branches:
      - 1.20.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: verify minecraft version
        run: grep -qx 'minecraft_version=1.20.1' gradle.properties
      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: microsoft
      - name: make scripts executable
        run: chmod +x ./gradlew ./buildAll.sh
      - name: build (desktop + Android/FCL)
        run: ./buildAll.sh
      - name: capture desktop jar
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-desktop-1.20.1
          path: |
            build/libs/VulkanMod_1.20.1-*.jar
            !build/libs/*-android*.jar
            !build/libs/*-slim.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: capture Android/FCL jar
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-android-1.20.1
          path: build/libs/VulkanMod_1.20.1-*-android.jar
          if-no-files-found: error
